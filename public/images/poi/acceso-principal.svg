  <!-- guardhouse -->
  <rect x="60" y="120" width="60" height="70" fill="#eaf5ee"/>
  <rect x="55" y="108" width="70" height="16" fill="#0b1f16"/>
  <rect x="78" y="145" width="20" height="30" fill="#3c9a6c"/>

